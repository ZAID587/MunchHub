services:
  - type: web
    name: munchhub
    env: docker
    plan: free
    region: oregon
    dockerfilePath: Dockerfile
    autoDeploy: true
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      - key: APP_NAME
        value: MunchHub
      - key: LOG_CHANNEL
        value: stderr
      - key: SESSION_DRIVER
        value: file
